name: CI

on: [push]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '21.2.0'
      - name: Install dependencies
        run: npm install
      - name: Run TypeScript type check
        run: npm run type-check
